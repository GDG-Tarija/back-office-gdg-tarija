<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Back Office GDG Tarija</title>
    <base href="/" />
    <script>
      // Aplica el tema antes del primer render (evita el parpadeo). Misma lógica que ThemeService.
      (function () {
        try {
          var stored = localStorage.getItem('mecha-theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Ejes fijos (opsz 24, wght 400, FILL 1, GRAD 0): son los únicos que usa la app. La fuente
         variable con todos los rangos pesa 5,4 MB y retrasa los iconos; esta, unos 460 KB. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
