@if (items().length) {
  <div
    class="rounded-2xl border border-google-red/20 bg-google-red-light/30 p-4 text-sm text-google-red"
    role="alert"
  >
    <p class="flex items-center gap-2 font-semibold">
      <span class="material-symbols-rounded text-xl" aria-hidden="true">error</span>
      {{ heading() }}
    </p>
    <ul class="mt-2 list-disc space-y-1 pl-9">
      @for (item of items(); track item.id) {
        <li>
          <a
            [href]="'#' + item.id"
            class="font-medium underline underline-offset-2"
            (click)="goTo($event, item.id)"
            >{{ item.label }}</a
          >: {{ item.message }}
        </li>
      }
    </ul>
  </div>
}
