<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm animate-fade-in"
>
  <div
    class="flex flex-col w-full bg-white dark:bg-neutral-900 rounded-3xl shadow-2xl overflow-hidden border border-black/5 dark:border-white/10 transition-all duration-300"
    [class]="sizeClass()"
  >
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 bg-google-blue text-white select-none">
      <div class="flex items-center gap-3 min-w-0">
        <span class="material-symbols-rounded text-xl opacity-90">{{ icon() }}</span>
        <h3 class="text-base font-semibold truncate">{{ title() }}</h3>
      </div>

      <div class="flex items-center gap-1">
        <!-- Pantalla completa -->
        <button
          type="button"
          (click)="toggleFullscreen()"
          class="flex size-8 items-center justify-center rounded-full hover:bg-white/20 transition-colors text-white"
          [title]="isFullscreen() ? 'Restaurar' : 'Pantalla completa'"
        >
          <span class="material-symbols-rounded text-lg">{{
            isFullscreen() ? 'fullscreen_exit' : 'fullscreen'
          }}</span>
        </button>

        <!-- Cerrar -->
        <button
          type="button"
          (click)="close()"
          class="flex size-8 items-center justify-center rounded-full hover:bg-red-500 transition-colors text-white"
          title="Cerrar"
        >
          <span class="material-symbols-rounded text-lg">close</span>
        </button>
      </div>
    </div>

    <!-- Body -->
    <div class="flex-1 p-6 overflow-y-auto max-h-[75vh]">
      <ng-content />
    </div>

    <!-- Footer -->
    <div
      class="flex items-center justify-end gap-3 px-6 py-4 border-t border-black/5 dark:border-white/5 bg-neutral-50/50 dark:bg-neutral-900/50"
    >
      <ng-content select="[dialog-actions]" />
    </div>
  </div>
</div>
