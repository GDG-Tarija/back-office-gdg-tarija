<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
  <app-stat-card
    title="Eventos"
    [value]="totalEventsCount()"
    icon="calendar_month"
    iconSeverity="blue"
    link="/events"
  />

  <app-stat-card
    title="Inscripciones"
    [value]="totalRegistrationsCount()"
    icon="group"
    [badge]="confirmedCount() + ' confirmadas'"
    badgeSeverity="green"
    iconSeverity="red"
  />

  <app-stat-card
    title="Cobrado (confirmadas)"
    [value]="collected() | bs"
    icon="account_balance_wallet"
    iconSeverity="green"
  />

  <app-stat-card
    title="Por cobrar (pendientes)"
    [value]="receivable() | bs"
    icon="hourglass_top"
    [badge]="pendingCount() + ' pendientes de pago'"
    badgeSeverity="yellow"
    iconSeverity="yellow"
  />
</div>
