<div
  class="flex flex-wrap items-end gap-4 rounded-2xl border border-black/5 dark:border-white/5 bg-white dark:bg-neutral-900 p-4"
  role="group"
  aria-label="Filtros de las métricas"
>
  <div class="flex flex-col gap-1 w-full sm:w-auto sm:min-w-[220px] sm:max-w-xs">
    <label for="filter-event" class="text-xs font-semibold text-text-secondary">Evento</label>
    <p-select
      inputId="filter-event"
      [options]="eventOptions()"
      [ngModel]="selectedEventId()"
      (ngModelChange)="onEventChange($event)"
      optionLabel="label"
      optionValue="value"
      ariaLabel="Filtrar por evento"
      styleClass="w-full text-sm"
      appendTo="body"
    />
  </div>

  <div class="flex flex-col gap-1 w-full sm:w-auto sm:min-w-[160px]">
    <label for="filter-role" class="text-xs font-semibold text-text-secondary">Rol</label>
    <p-select
      inputId="filter-role"
      [options]="roleOptions()"
      [ngModel]="selectedRole()"
      (ngModelChange)="onRoleChange($event)"
      optionLabel="label"
      optionValue="value"
      ariaLabel="Filtrar por rol"
      styleClass="w-full text-sm"
      appendTo="body"
    />
  </div>

  <div class="flex flex-col gap-1 w-full sm:w-auto sm:min-w-[230px]">
    <label for="filter-date" class="text-xs font-semibold text-text-secondary">
      Fecha del evento
    </label>
    <p-datepicker
      inputId="filter-date"
      [ngModel]="selectedDateRange()"
      (ngModelChange)="onDateChange($event)"
      selectionMode="range"
      [showIcon]="true"
      placeholder="Todas las fechas"
      ariaLabel="Filtrar por rango de fechas del evento"
      styleClass="w-full text-sm"
      dateFormat="dd/mm/yy"
      [readonlyInput]="true"
      appendTo="body"
    />
  </div>

  @if (selectedEventId() || selectedRole() || selectedDateRange()) {
    <p-button
      label="Limpiar filtros"
      icon="pi pi-filter-slash"
      severity="secondary"
      [text]="true"
      size="small"
      (onClick)="onReset()"
    />
  }
</div>
