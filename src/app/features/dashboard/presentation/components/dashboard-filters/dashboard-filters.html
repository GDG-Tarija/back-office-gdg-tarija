<div
  class="flex flex-col gap-2 sm:flex-row sm:flex-wrap sm:items-center"
  role="group"
  aria-label="Filtros de las métricas"
>
  <div class="relative w-full sm:w-56">
    <label for="filter-event" class="sr-only">Evento</label>
    <p-select
      inputId="filter-event"
      [options]="eventOptions()"
      [ngModel]="selectedEventId()"
      (ngModelChange)="onEventChange($event)"
      optionLabel="label"
      optionValue="value"
      ariaLabel="Filtrar por evento"
      [styleClass]="fieldClass(!!selectedEventId())"
      appendTo="body"
    >
      <ng-template #dropdownicon>
        <span class="material-symbols-rounded text-lg text-text-muted" aria-hidden="true"
          >expand_more</span
        >
      </ng-template>
    </p-select>
    <span [class]="iconClass(!!selectedEventId())" aria-hidden="true">event</span>
  </div>

  <div class="relative w-full sm:w-44">
    <label for="filter-role" class="sr-only">Rol</label>
    <p-select
      inputId="filter-role"
      [options]="roleOptions()"
      [ngModel]="selectedRole()"
      (ngModelChange)="onRoleChange($event)"
      optionLabel="label"
      optionValue="value"
      ariaLabel="Filtrar por rol"
      [styleClass]="fieldClass(!!selectedRole())"
      appendTo="body"
    >
      <ng-template #dropdownicon>
        <span class="material-symbols-rounded text-lg text-text-muted" aria-hidden="true"
          >expand_more</span
        >
      </ng-template>
    </p-select>
    <span [class]="iconClass(!!selectedRole())" aria-hidden="true">badge</span>
  </div>

  <div class="relative w-full sm:w-60">
    <label for="filter-date" class="sr-only">Fecha del evento</label>
    <p-datepicker
      inputId="filter-date"
      [ngModel]="selectedDateRange()"
      (ngModelChange)="onDateChange($event)"
      selectionMode="range"
      placeholder="Todas las fechas"
      ariaLabel="Filtrar por rango de fechas del evento"
      [styleClass]="dateClass(!!selectedDateRange())"
      dateFormat="dd/mm/yy"
      [readonlyInput]="true"
      appendTo="body"
    />
    <span [class]="iconClass(!!selectedDateRange())" aria-hidden="true">date_range</span>
    <span
      class="material-symbols-rounded pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-lg text-text-muted"
      aria-hidden="true"
      >expand_more</span
    >
  </div>

  @if (selectedEventId() || selectedRole() || selectedDateRange()) {
    <button
      type="button"
      (click)="onReset()"
      class="inline-flex min-h-11 items-center gap-1 self-start rounded-full px-3 text-sm font-semibold text-accent-text hover:bg-info-bg sm:self-auto"
    >
      <span class="material-symbols-rounded text-lg" aria-hidden="true">filter_alt_off</span>
      Limpiar filtros
    </button>
  }
</div>
