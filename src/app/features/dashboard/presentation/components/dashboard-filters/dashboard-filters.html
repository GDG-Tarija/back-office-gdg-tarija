<div
  class="flex flex-wrap items-center gap-4 rounded-3xl border border-black/5 dark:border-white/5 bg-white dark:bg-neutral-900 p-4 sm:p-5 shadow-xs transition-all"
>
  <div class="flex items-center gap-2 pr-2">
    <span class="material-symbols-rounded text-google-blue text-2xl">filter_list</span>
    <span class="text-sm font-bold text-text-primary dark:text-neutral-200">Filtros:</span>
  </div>

  <!-- Event Select -->
  <div class="flex flex-col w-full sm:w-auto sm:min-w-[220px] sm:max-w-xs">
    <p-select
      id="filter-event"
      [options]="eventOptions()"
      [ngModel]="selectedEventId()"
      (ngModelChange)="onEventChange($event)"
      optionLabel="label"
      optionValue="value"
      placeholder="Todos los eventos"
      styleClass="w-full text-sm !rounded-xl"
      appendTo="body"
    />
  </div>

  <!-- Role Select -->
  <div class="flex flex-col w-full sm:w-auto sm:min-w-[160px]">
    <p-select
      id="filter-role"
      [options]="roleOptions()"
      [ngModel]="selectedRole()"
      (ngModelChange)="onRoleChange($event)"
      optionLabel="label"
      optionValue="value"
      placeholder="Todos los roles"
      styleClass="w-full text-sm !rounded-xl"
      appendTo="body"
    />
  </div>

  <!-- Date Range DatePicker -->
  <div class="flex flex-col w-full sm:w-auto sm:min-w-[210px]">
    <p-datepicker
      id="filter-date"
      [ngModel]="selectedDateRange()"
      (ngModelChange)="onDateChange($event)"
      selectionMode="range"
      [showIcon]="true"
      placeholder="Rango de fechas"
      styleClass="w-full text-sm !rounded-xl"
      dateFormat="dd/mm/yy"
      [readonlyInput]="true"
      appendTo="body"
    />
  </div>

  <!-- Reset Button -->
  @if (selectedEventId() || selectedRole() || selectedDateRange()) {
    <button
      type="button"
      (click)="onReset()"
      class="flex items-center gap-1.5 px-4 py-2 rounded-full text-xs font-semibold text-google-red bg-google-red-light/40 hover:bg-google-red-light/70 dark:bg-google-red/20 dark:hover:bg-google-red/30 transition-all ml-auto sm:ml-0"
      title="Limpiar filtros"
    >
      <span class="material-symbols-rounded text-base">filter_alt_off</span>
      <span>Limpiar</span>
    </button>
  }
</div>
