<div class="relative z-10 mx-auto w-full max-w-md">
  <div class="login-card overflow-hidden">
    <div class="p-8 sm:p-10">
      <!-- Logo de la comunidad -->
      <img [src]="logo.src" [alt]="logo.alt" class="h-9 w-auto" />

      <h1
        class="mt-8 text-2xl font-extrabold tracking-tight text-text-primary dark:text-neutral-50 sm:text-3xl"
      >
        Iniciar sesión
      </h1>
      <p class="mt-2 text-sm leading-relaxed text-text-secondary dark:text-neutral-400">
        Accedé al panel administrativo de GDG Tarija.
      </p>

      <!-- Alerta de error -->
      @if (error(); as err) {
        <div
          class="mt-6 flex items-center gap-3 rounded-2xl bg-google-red-light/50 dark:bg-google-red/15 p-3.5 text-xs font-semibold text-google-red border border-google-red/20"
        >
          <span class="material-symbols-rounded text-lg shrink-0">error</span>
          <span>{{ err }}</span>
        </div>
      }

      <!-- Botón Google Sign-In Oficial -->
      <div class="mt-8">
        <button
          type="button"
          (click)="loginWithGoogle()"
          [disabled]="loading()"
          class="w-full flex items-center justify-center gap-3 py-3.5 px-6 rounded-full font-bold text-sm text-neutral-800 dark:text-white bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 hover:border-neutral-300 dark:hover:border-neutral-600 shadow-xs hover:shadow-md transition-all duration-200 cursor-pointer disabled:opacity-60 active:scale-[0.99]"
        >
          @if (loading()) {
            <div class="gdg-spinner !size-5"></div>
            <span>Conectando...</span>
          } @else {
            <!-- SVG Oficial 4 colores de Google -->
            <svg class="size-5 shrink-0" viewBox="0 0 24 24">
              <path
                fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              />
              <path
                fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              />
              <path
                fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
              />
              <path
                fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
              />
            </svg>
            <span>Continuar con Google</span>
          }
        </button>
      </div>

      <p class="mt-6 text-[11px] text-text-secondary dark:text-neutral-400 text-center">
        Acceso solo para usuarios autorizados.
      </p>
    </div>

    <!-- Barra de acento multicolor de Google -->
    <div class="grid h-1.5 grid-cols-4">
      <div class="bg-google-blue"></div>
      <div class="bg-google-red"></div>
      <div class="bg-google-yellow"></div>
      <div class="bg-google-green"></div>
    </div>
  </div>
</div>
