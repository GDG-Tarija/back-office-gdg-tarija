<header class="space-y-4">
  <nav aria-label="Migas de pan">
    <ol
      class="flex flex-wrap items-center gap-x-1.5 gap-y-1 text-sm text-text-secondary dark:text-neutral-400"
    >
      <li>
        <a routerLink="/events" class="rounded font-medium underline-offset-2 hover:underline">
          Eventos
        </a>
      </li>
      @if (event(); as e) {
        <li aria-hidden="true">›</li>
        <li class="min-w-0">
          <a
            [routerLink]="hubLink()"
            class="inline-block max-w-[16rem] truncate rounded align-bottom font-medium underline-offset-2 hover:underline sm:max-w-sm"
          >
            {{ e.title }}
          </a>
        </li>
      }
      <li aria-hidden="true">›</li>
      <li aria-current="page" class="font-semibold text-text-primary dark:text-neutral-200">
        {{ sectionLabel() }}
      </li>
    </ol>
  </nav>

  @if (event(); as e) {
    <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
      <div class="min-w-0 space-y-1.5">
        <h1 class="text-2xl font-bold tracking-tight text-text-primary dark:text-neutral-100">
          {{ e.title }}
        </h1>
        <div
          class="flex flex-wrap items-center gap-x-3 gap-y-1.5 text-sm text-text-secondary dark:text-neutral-400"
        >
          <span>{{ e.dateStart | date: 'EEE d MMM y, HH:mm' }}</span>
          <p-tag
            [value]="e.isPublished ? 'Publicado' : 'Borrador'"
            [severity]="e.isPublished ? 'success' : 'secondary'"
          />
          <span class="text-xs font-semibold uppercase tracking-wide">{{ timing() }}</span>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2"><ng-content /></div>
    </div>

    <nav aria-label="Secciones del evento" class="flex flex-wrap gap-2">
      @if (isSuperadmin()) {
        <a
          [routerLink]="['/events', e.id, 'edit']"
          [attr.aria-current]="section() === 'manage' ? 'page' : null"
          class="inline-flex min-h-11 items-center gap-1.5 rounded-full border px-4 text-sm font-semibold transition-colors"
          [class]="
            section() === 'manage'
              ? 'border-google-blue bg-google-blue-light/60 text-accent-text dark:bg-google-blue/20'
              : 'border-black/10 text-text-secondary hover:bg-neutral-100 dark:border-white/10 dark:text-neutral-300 dark:hover:bg-neutral-800'
          "
        >
          <span class="material-symbols-rounded text-base" aria-hidden="true">tune</span>
          Configuración
        </a>
      }
      <a
        [routerLink]="['/events', e.id, 'attendees']"
        [attr.aria-current]="section() === 'attendees' ? 'page' : null"
        class="inline-flex min-h-11 items-center gap-1.5 rounded-full border px-4 text-sm font-semibold transition-colors"
        [class]="
          section() === 'attendees'
            ? 'border-google-blue bg-google-blue-light/60 text-accent-text dark:bg-google-blue/20'
            : 'border-black/10 text-text-secondary hover:bg-neutral-100 dark:border-white/10 dark:text-neutral-300 dark:hover:bg-neutral-800'
        "
      >
        <span class="material-symbols-rounded text-base" aria-hidden="true">group</span>
        Asistentes
      </a>
      <a
        routerLink="/checkin"
        [queryParams]="{ event: e.id }"
        class="inline-flex min-h-11 items-center gap-1.5 rounded-full border border-black/10 px-4 text-sm font-semibold text-text-secondary transition-colors hover:bg-neutral-100 dark:border-white/10 dark:text-neutral-300 dark:hover:bg-neutral-800"
      >
        <span class="material-symbols-rounded text-base" aria-hidden="true">qr_code_scanner</span>
        Check-in
      </a>
    </nav>
  }
</header>
