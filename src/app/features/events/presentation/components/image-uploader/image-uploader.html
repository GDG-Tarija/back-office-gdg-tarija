<div class="flex flex-col gap-2">
  <span class="text-sm font-semibold text-text-primary dark:text-neutral-200">{{ label() }}</span>

  <div
    class="flex flex-col gap-3 rounded-2xl border border-dashed border-black/10 dark:border-white/10 p-3 sm:flex-row sm:items-center"
  >
    <div
      class="flex h-24 w-full shrink-0 items-center justify-center overflow-hidden rounded-xl bg-neutral-100 dark:bg-neutral-800 sm:w-40"
    >
      @if (uploading()) {
        <span
          class="material-symbols-rounded animate-gdg-spin text-2xl text-google-blue"
          aria-hidden="true"
          >progress_activity</span
        >
        <span class="sr-only" role="status">Subiendo imagen...</span>
      } @else if (value(); as url) {
        <img [src]="url" [alt]="'Vista previa: ' + label()" class="size-full object-cover" />
      } @else {
        <span
          class="material-symbols-rounded text-3xl text-neutral-300 dark:text-neutral-600"
          aria-hidden="true"
          >image</span
        >
      }
    </div>

    <div class="flex flex-1 flex-col gap-2">
      <div class="flex flex-wrap items-center gap-2">
        <label
          class="inline-flex cursor-pointer items-center gap-1.5 rounded-full bg-google-blue-light/60 px-3 py-1.5 text-xs font-semibold text-google-blue transition-colors hover:bg-google-blue-light focus-within:ring-2 focus-within:ring-google-blue dark:bg-google-blue/20"
          [class.pointer-events-none]="uploading()"
          [class.opacity-60]="uploading()"
        >
          <span class="material-symbols-rounded text-sm" aria-hidden="true">upload</span>
          <span>{{ value() ? 'Reemplazar' : 'Subir imagen' }}</span>
          <input
            type="file"
            class="sr-only"
            accept="image/jpeg,image/png,image/webp"
            [disabled]="uploading()"
            [attr.aria-label]="(value() ? 'Reemplazar ' : 'Subir ') + label()"
            (change)="onFileSelected($event)"
          />
        </label>

        @if (value()) {
          <button
            type="button"
            class="inline-flex items-center gap-1.5 rounded-full bg-neutral-100 px-3 py-1.5 text-xs font-semibold text-text-primary transition-colors hover:bg-neutral-200 dark:bg-neutral-800 dark:text-neutral-200 dark:hover:bg-neutral-700"
            [disabled]="uploading()"
            [attr.aria-label]="'Quitar ' + label()"
            (click)="clear()"
          >
            <span class="material-symbols-rounded text-sm" aria-hidden="true">delete</span>
            <span>Quitar</span>
          </button>
        }
      </div>
      <p class="text-xs text-text-secondary dark:text-neutral-400">{{ hint() }}</p>
      @if (error(); as err) {
        <p class="text-xs font-medium text-google-red" role="alert">{{ err }}</p>
      }
    </div>
  </div>
</div>
