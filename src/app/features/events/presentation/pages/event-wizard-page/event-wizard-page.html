<div class="gdg-page min-w-0 space-y-6 p-4 sm:p-8">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h1
        class="text-2xl font-extrabold tracking-tight text-text-primary sm:text-3xl dark:text-neutral-100"
      >
        Nuevo evento
      </h1>
      <p class="mt-1 text-sm text-text-secondary dark:text-neutral-400">
        Empieza por los datos. Al guardar se crea un borrador y sigues con el resto de pasos; puedes
        retomarlo desde la lista de eventos.
      </p>
    </div>
    <a
      routerLink="/events"
      class="inline-flex min-h-11 items-center gap-1.5 self-start rounded-full bg-neutral-100 px-4 py-2 text-sm font-semibold text-text-primary transition-colors hover:bg-neutral-200 dark:bg-neutral-800 dark:text-neutral-200 dark:hover:bg-neutral-700"
    >
      <span class="material-symbols-rounded text-base" aria-hidden="true">arrow_back</span>
      Volver a eventos
    </a>
  </div>

  @if (error(); as err) {
    <div
      class="flex items-center gap-3 rounded-2xl border border-google-red/20 bg-google-red-light/30 p-4 text-sm font-medium text-danger-text"
      role="alert"
    >
      <span class="material-symbols-rounded text-xl" aria-hidden="true">error</span>
      <span>{{ err }}</span>
    </div>
  }

  <div
    class="rounded-3xl border border-black/5 bg-white p-4 shadow-xs sm:p-6 dark:border-white/5 dark:bg-neutral-900"
  >
    <app-event-basics-form
      [event]="null"
      [saving]="saving()"
      [serverError]="serverError()"
      submitLabel="Crear borrador y continuar"
      (save)="onSave($event)"
    />
  </div>
</div>

<app-unsaved-changes-dialog
  [visible]="prompt.visible()"
  [saving]="saving()"
  (choose)="prompt.answer($event)"
/>
