<div class="flex min-h-screen bg-surface-main dark:bg-neutral-950 transition-all duration-300">
  <!-- Sidebar Container (Desktop: fixed, Mobile: drawer) -->
  <aside
    [class.translate-x-0]="isSidebarOpen()"
    [class.-translate-x-full]="!isSidebarOpen()"
    class="fixed inset-y-0 left-0 z-40 flex w-64 flex-col border-r border-black/5 dark:border-white/5 bg-white dark:bg-neutral-900 transition-transform duration-300 ease-in-out md:translate-x-0"
  >
    <!-- Logo Header in Sidebar -->
    <div
      class="flex h-16 items-center justify-between px-6 border-b border-black/5 dark:border-white/5"
    >
      <div class="flex items-center gap-2">
        <img [src]="logo.src" [alt]="logo.alt" class="h-8 w-auto" />
      </div>
      <!-- Close button on Mobile -->
      <button
        type="button"
        class="flex size-9 items-center justify-center rounded-full text-text-secondary dark:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-800 md:hidden transition-colors"
        (click)="toggleSidebar()"
        aria-label="Cerrar menú"
      >
        <span class="material-symbols-rounded text-xl">close</span>
      </button>
    </div>

    <!-- Navigation List -->
    <nav class="flex-1 space-y-1 px-4 py-6">
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-google-blue-light/50 dark:bg-google-blue/15 text-google-blue font-semibold shadow-sm"
        class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-medium text-text-secondary dark:text-neutral-300 transition-all hover:bg-neutral-100/80 dark:hover:bg-neutral-800/60 hover:text-text-primary dark:hover:text-neutral-100"
        (click)="closeSidebarOnMobile()"
      >
        <span class="material-symbols-rounded text-xl">dashboard</span>
        <span>Dashboard</span>
      </a>

      <a
        routerLink="/events"
        routerLinkActive="bg-google-blue-light/50 dark:bg-google-blue/15 text-google-blue font-semibold shadow-sm"
        class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-medium text-text-secondary dark:text-neutral-300 transition-all hover:bg-neutral-100/80 dark:hover:bg-neutral-800/60 hover:text-text-primary dark:hover:text-neutral-100"
        (click)="closeSidebarOnMobile()"
      >
        <span class="material-symbols-rounded text-xl">calendar_month</span>
        <span>Eventos</span>
      </a>

      <a
        routerLink="/checkin"
        routerLinkActive="bg-google-blue-light/50 dark:bg-google-blue/15 text-google-blue font-semibold shadow-sm"
        class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-medium text-text-secondary dark:text-neutral-300 transition-all hover:bg-neutral-100/80 dark:hover:bg-neutral-800/60 hover:text-text-primary dark:hover:text-neutral-100"
        (click)="closeSidebarOnMobile()"
      >
        <span class="material-symbols-rounded text-xl">qr_code_scanner</span>
        <span>Check-in</span>
      </a>
    </nav>

    <!-- Sidebar Footer -->
    <div class="border-t border-black/5 dark:border-white/5 p-4 flex flex-col gap-4">
      <!-- Theme Switcher & Logout Row -->
      <div
        class="flex items-center justify-between bg-surface-main dark:bg-neutral-950 p-2 rounded-2xl border border-black/5 dark:border-white/5"
      >
        <!-- Theme Toggle -->
        <button
          type="button"
          (click)="theme.toggle()"
          class="flex items-center gap-2 px-2.5 py-1.5 rounded-xl text-xs font-semibold text-text-secondary dark:text-neutral-300 hover:bg-white dark:hover:bg-neutral-800 transition-all shadow-xs"
          aria-label="Alternar tema"
        >
          <span class="material-symbols-rounded text-base text-google-yellow">
            {{ theme.isDark() ? 'light_mode' : 'dark_mode' }}
          </span>
          <span>{{ theme.isDark() ? 'Claro' : 'Oscuro' }}</span>
        </button>

        <!-- Logout -->
        <button
          type="button"
          (click)="auth.signOut()"
          class="flex size-8 items-center justify-center rounded-xl text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/40 transition-colors"
          aria-label="Cerrar sesión"
          title="Cerrar sesión"
        >
          <span class="material-symbols-rounded text-lg">logout</span>
        </button>
      </div>

      <!-- User Profile summary -->
      @if (auth.user(); as user) {
        <div class="flex items-center gap-3 px-2 py-1">
          @if (user.avatar_url) {
            <img
              class="size-10 rounded-full object-cover ring-2 ring-google-blue/20"
              [src]="user.avatar_url"
              alt="Avatar"
              referrerpolicy="no-referrer"
            />
          } @else {
            <div
              class="flex size-10 items-center justify-center rounded-full bg-google-blue-light dark:bg-google-blue/20 text-google-blue text-sm font-bold shadow-xs"
            >
              {{ user.first_name[0] }}{{ user.last_name[0] }}
            </div>
          }
          <div class="flex flex-col min-w-0">
            <span class="truncate text-sm font-bold text-text-primary dark:text-neutral-200">
              {{ user.first_name }} {{ user.last_name }}
            </span>
            <span class="truncate text-xs text-text-secondary dark:text-neutral-400">
              {{ user.email }}
            </span>
          </div>
        </div>
      }
    </div>
  </aside>

  <!-- Mobile Overlay Backdrop -->
  @if (isSidebarOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-30 bg-black/40 backdrop-blur-sm md:hidden w-full h-full cursor-default border-none outline-none"
      (click)="toggleSidebar()"
      aria-label="Cerrar menú"
    ></button>
  }

  <!-- Main Content Layout Area -->
  <div class="flex flex-1 flex-col md:pl-64">
    <!-- Top Mobile Header -->
    <header
      class="flex h-16 items-center justify-between border-b border-black/5 dark:border-white/5 bg-white dark:bg-neutral-900 px-6 md:hidden"
    >
      <div class="flex items-center gap-3">
        <button
          type="button"
          class="flex size-9 items-center justify-center rounded-full text-text-secondary dark:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors"
          (click)="toggleSidebar()"
          aria-label="Abrir menú"
        >
          <span class="material-symbols-rounded text-2xl">menu</span>
        </button>
        <img [src]="logo.src" [alt]="logo.alt" class="h-6 w-auto" />
      </div>
    </header>

    <!-- Main router content outlet page -->
    <div class="flex-1">
      <router-outlet />
    </div>
  </div>
</div>
